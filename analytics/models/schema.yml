models:
  - name: job_postings
    description: "Model for job postings data"
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_id
        description: "Unique identifier for the job posting"
      - name: job_title
        description: "Title of the job posting"
        data_tests:
          - not_null
      - name: company_name
        description: "Name of the company posting the job"
      - name: job_location
        description: "Location of the job"
      - name: job_via
        description: "Source through which the job was posted"
      - name: job_schedule_type
        description: "Type of job schedule (e.g., full-time, part-time)"
      - name: job_work_from_home
        description: "Indicates if the job allows working from home"
      - name: search_date
        description: "Date when the job was searched"
      - name: search_term
        description: "Search term used to find the job"
      - name: search_location
        description: "Location used in the job search"

  - name: jobs_per_month
    description: "Model for the number of job postings per month"
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: "Month of the job postings"
      - name: role
        description: "Job role (search term used)"
      - name: postings
        description: "Number of job postings counted for that month"

  - name: jobs_per_location
    description: "Model for the number of job postings per location"
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: location
        description: "Location of the job postings"
      - name: postings
        description: "Number of job postings in the location"

  - name: monthly_summary
    description: "Model for the monthly summary of job postings and remote postings"
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: "Month of the job postings"
        data_tests:
          - not_null
          - unique
      - name: total_postings
        description: "Total number of job postings in the month"
      - name: remote_postings
        description: "Number of remote job postings in the month"
      - name: pct_remote
        description: "Percentage of remote job postings in the month"